<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected Pack · Campaign Calendar</title>
<script src="vendor/exceljs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#F40009;--red-dark:#C90008;--red-soft:#FFF0F1;--ink:#171513;--muted:#6F6A65;
  --hint:#A39D97;--line:#E8E4DF;--line-strong:#D1CBC5;--paper:#FFF;--canvas:#F4F2EF;
  --shadow:0 7px 28px rgba(31,25,20,.06);--sans:Unity,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:14px;min-height:100vh}
button,input,select{font:inherit}
.export-btn{height:34px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:6px;padding:0 13px;cursor:pointer;font-size:11px;font-weight:800;white-space:nowrap}
.export-btn:hover{background:var(--red);color:#fff}.export-btn:disabled{opacity:.55;cursor:wait}
.top-rule{height:5px;background:var(--red)}
.shell{max-width:1540px;margin:0 auto;padding:26px 28px 48px}
.hero{background:#090909;color:#fff;border-radius:12px 12px 0 0;padding:27px 30px;min-height:160px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-55px;top:-82px;width:250px;height:250px;border:38px solid rgba(244,0,9,.23);border-radius:50%}
.mark{width:36px;height:36px;border:2px solid var(--red);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;flex:none;position:relative;z-index:3}
.mark i{background:var(--red);border-radius:1px}.mark i:last-child{background:transparent}
.hero-copy{min-width:0;position:relative;z-index:3}.eyebrow{font-size:11px;letter-spacing:1.45px;color:#FF6A70;font-weight:850;margin-bottom:6px}
h1{font-size:29px;line-height:1.12;letter-spacing:-.45px}.hero-sub{font-size:13px;color:#D2CDCA;margin-top:8px}
.hero-brand-logo{position:absolute;right:24px;top:22px;width:190px;height:auto;object-fit:contain;z-index:3}
.hero-double-bottle{position:absolute;right:17.5%;bottom:-17px;height:190px;width:auto;z-index:2;opacity:.96;pointer-events:none}
.uad-credit{position:absolute;right:22px;bottom:18px;z-index:3;color:#fff;border:1px solid rgba(255,255,255,.72);border-radius:99px;padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:.65px;background:rgba(0,0,0,.28)}
.panel{background:var(--paper);border-radius:0 0 12px 12px;box-shadow:var(--shadow);padding:18px 20px 24px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));border:1px solid var(--line);margin-bottom:16px}
.metric{padding:13px 16px;border-right:1px solid var(--line);display:grid;grid-template-rows:18px 32px 18px;align-items:center}.metric:last-child{border-right:0}
.metric-label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.15px}
.metric-val{font-size:25px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}.metric-val.red{color:var(--red)}.metric-sub{font-size:12px;color:var(--hint);line-height:18px}
.brand-nav-wrap{margin-bottom:14px;padding:13px 14px 11px;border:1px solid var(--line);border-radius:9px;background:#FAF9F7}
.brand-nav-head{display:flex;align-items:center;margin-bottom:10px}.brand-nav-title{font-size:13px;font-weight:850}
.brand-nav{display:grid;grid-template-columns:repeat(12,minmax(58px,1fr));gap:7px}
.brand-chip{width:74px;height:74px;justify-self:center;border:1px solid transparent;background:#fff;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:750;transition:.16s ease;position:relative}
.brand-chip:hover{transform:translateY(-1px);border-color:var(--line-strong);box-shadow:0 4px 10px rgba(30,25,20,.06)}
.brand-chip.active{border-color:var(--brand-color,var(--red));box-shadow:inset 0 0 0 1px var(--brand-color,var(--red));color:var(--ink);background:#fff}
.brand-chip[data-brand=""].active{background:#171513;color:#fff;border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.brand-chip.active:not([data-brand=""]):after{content:"×";position:absolute;right:5px;top:3px;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;background:var(--brand-color,var(--red));color:#fff;font-size:10px;font-weight:900}
.brand-chip img{width:42px;height:42px;object-fit:contain}.brand-chip.text-logo span:first-child{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#DFF1FA;color:#24759B;font-size:9px;font-weight:900}
.brand-chip[data-brand="MM"] img{transform:scale(1.18)}.brand-chip[data-brand="COSTA"] img{transform:scale(1.35)}.brand-chip[data-brand="Smart"] img{transform:scale(1.34)}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 12px;background:transparent;border:0}
.search-box{width:300px;height:38px;border:1px solid var(--line-strong);background:#fff;border-radius:6px;display:flex;align-items:center;padding:0 11px;gap:8px;color:var(--hint)}
.search-box svg{width:15px;height:15px;flex:none}.search-box input{border:0!important;padding:0!important;width:100%!important;height:36px!important}
.filters input,.filters select{height:38px;border:1px solid var(--line-strong);background:#fff;border-radius:6px;padding:0 12px;outline:none;color:var(--ink);font-size:13px}
.filters input{width:270px}.filters select{min-width:190px}.filters input:focus,.filters select:focus{border-color:var(--red)}
.clear-filter{height:34px;border:0;background:transparent;color:#8C8680;padding:0 7px;cursor:pointer;font-size:11px;font-weight:650}
.clear-filter:hover{color:var(--red)}
.clear-filter:disabled{visibility:hidden}
.toolbar-spacer{margin-left:auto}
.refresh{height:34px;border:1px solid #111;background:#111;color:#fff;border-radius:6px;padding:0 12px;cursor:pointer;font-size:11px;font-weight:700}
.refresh:hover{background:var(--red);border-color:var(--red)}
.refresh-icon{font-size:15px;display:inline-block;vertical-align:-1px;margin-right:4px}
.status-text{display:none}
.legend-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);overflow:hidden}
.reading-key{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px;font-weight:700;white-space:nowrap}.key-item{display:flex;align-items:center;gap:4px}.key-block{width:18px;height:8px;border-radius:2px;background:#D83A3A}.key-block.pending{opacity:.55;border:1px dashed #675C54;background-image:repeating-linear-gradient(135deg,#fff9 0,#fff9 4px,transparent 4px,transparent 8px)}
.legend{display:flex;flex-wrap:nowrap;gap:7px 9px;padding:11px 0;min-width:0;overflow-x:auto;scrollbar-width:none}.legend::-webkit-scrollbar{display:none}
.legend-item{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:10px;white-space:nowrap}.legend-title{font-size:12px;font-weight:850;color:var(--ink);margin-right:2px;white-space:nowrap}
.swatch{width:9px;height:9px;border-radius:2px}
.group{position:relative;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:#fff;margin-top:14px;box-shadow:0 3px 14px rgba(25,20,17,.035)}
.group:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--group-color,var(--red));z-index:4}
.group-head{min-height:60px;background:#F1EFEC;display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line)}
.group-head.can-collapse{cursor:pointer;user-select:none}.group-head.can-collapse:hover{background:#EBE8E4}
.fold-arrow{width:14px;color:var(--muted);font-size:10px;transition:transform .16s}.fold-arrow.open{transform:rotate(90deg)}
.brand-badge{width:40px;height:40px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}.brand-badge img{width:36px;height:36px;object-fit:contain}.brand-badge.text{font-size:9px;font-weight:900}
.brand-badge.brand-MM img{transform:scale(1.12)}.brand-badge.brand-COSTA img{transform:scale(1.32)}.brand-badge.brand-Smart img{transform:scale(1.28)}
.group-title{font-size:16px;font-weight:850}.group-count{font-size:13px;color:var(--muted)}.group-count strong{font-size:17px;color:var(--red);margin-right:3px}
.today-pill{display:flex;align-items:center;gap:5px;background:var(--red-soft);border:1px solid #F6B7BA;color:var(--red);padding:3px 8px;border-radius:99px;font-size:10px;font-weight:750}
.today-pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.gantt{overflow-x:auto}.gantt-head,.gantt-row{display:flex;min-width:850px}.gantt-head{background:#FAF9F7;border-bottom:2px solid var(--line)}
.gantt-row{border-bottom:1px solid var(--line)}.gantt-row:last-child{border-bottom:0}.gantt-row:hover{background:#FBFAF8}
.label{width:220px;min-width:220px;padding:7px 11px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.label-head{font-size:11px;font-weight:800;color:var(--muted);justify-content:center}
.src{font-size:12px;font-weight:800;color:var(--red)}.sku{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.track{min-width:630px;flex:1;height:34px;position:relative;background:#fff}
.month-track{height:26px;background:none}.month{position:absolute;top:0;height:26px;padding:5px 6px;border-right:1px solid var(--line);font-size:10px;color:var(--muted)}
.seg{position:absolute;top:5px;height:24px;border-radius:3px;padding:0 6px;display:flex;align-items:center;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;color:#302B27;min-width:2px}
.seg.pending{opacity:.58;border:1px dashed rgba(65,57,50,.38);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.52) 0,rgba(255,255,255,.52) 6px,rgba(255,255,255,.08) 6px,rgba(255,255,255,.08) 12px)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:rgba(244,0,9,.62);z-index:3;pointer-events:none}
.empty{padding:50px 20px;text-align:center;color:var(--hint)}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.tooltip{position:fixed;z-index:20;background:#111;color:#fff;border-radius:7px;padding:10px 12px;font-size:12px;line-height:1.7;box-shadow:0 8px 28px rgba(0,0,0,.2);pointer-events:none}
@media(max-width:1080px){.brand-nav{grid-template-columns:repeat(6,1fr)}.legend-row{align-items:flex-start;flex-direction:column;gap:0}.reading-key{margin:0 0 10px}}
@media(max-width:760px){.shell{padding:14px 10px 32px}.hero{padding:18px;min-height:148px;gap:12px}.hero-brand-logo{display:none}.hero-double-bottle{right:3%;height:145px;opacity:.45}.uad-credit{right:14px;bottom:11px}.panel{padding:12px}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.brand-nav{grid-template-columns:repeat(4,1fr)}.search-box{width:100%}.filters select{width:100%}.toolbar-spacer{display:none}.label{width:175px;min-width:175px}}
</style>
</head>
<body>
<div class="top-rule"></div>
<main class="shell">
  <section class="hero">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div class="hero-copy">
      <div class="eyebrow">CLIENT VIEW · READ ONLY</div>
      <h1>Connected Pack · Campaign Calendar</h1>
      <div class="hero-sub">让每一瓶产品，都成为连接消费者数字体验的入口</div>
    </div>
    <img class="hero-double-bottle" src="assets/coke-bottle-reference.png" alt="" aria-hidden="true">
    <img class="hero-brand-logo" src="assets/coke-bar-logo-red-white.png" alt="可口可乐吧">
    <span class="uad-credit">By UAD</span>
  </section>
  <section class="panel">
    <div class="metrics">
      <div class="metric"><div class="metric-label">SKU 数量</div><div id="m-sku" class="metric-val red">—</div><div class="metric-sub">2025 年开始的产码记录</div></div>
      <div class="metric"><div class="metric-label">Campaign 数量</div><div id="m-code" class="metric-val">—</div><div class="metric-sub">瓶身码落地的 Campaign</div></div>
      <div class="metric"><div class="metric-label">Data Version</div><div id="m-date" class="metric-val">正在读取</div><div class="metric-sub">Weekly update · 每周五</div></div>
    </div>
    <div class="brand-nav-wrap">
      <div class="brand-nav-head"><span class="brand-nav-title">按品牌快速查看</span></div>
      <div id="brand-nav" class="brand-nav"></div>
    </div>
    <div class="filters">
      <label class="search-box" for="q">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="搜索 SKU、品牌或 utm_source">
      </label>
      <select id="code"><option value="">全部活动</option></select>
      <button id="clear-filter" class="clear-filter" type="button" disabled>× 清除筛选</button>
      <span class="toolbar-spacer"></span>
      <button class="refresh" id="refresh"><span class="refresh-icon">↻</span>刷新数据</button>
      <button class="export-btn" id="export">↓ 导出 Excel</button>
    </div>
    <span id="status" class="status-text">正在读取团队数据…</span>
    <div class="legend-row">
      <div id="legend" class="legend"></div>
      <span class="reading-key"><span class="key-item"><i class="key-block"></i>实色 = 活动进行中</span><span class="key-item"><i class="key-block pending"></i>虚色 = 待切码计划</span></span>
    </div>
    <div id="calendar"></div>
  </section>
</main>
<script src="calendar-data.js"></script>
<script>
(function(){
  'use strict';
  var data={recs:[],cuts:[],camps:[],savedAt:''};
  var selectedBrand='',collapsedBrands={};
  var BRAND_DEFS=[
    {key:'Coke',label:'Coke',logo:'coke.png',color:'#F40009',aliases:['Coke']},
    {key:'Sprite',label:'Sprite',logo:'sprite.png',color:'#159447',aliases:['Sprite']},
    {key:'Fanta',label:'Fanta',logo:'fanta.png',color:'#F28A18',aliases:['Fanta']},
    {key:'Schweppes',label:'Schweppes',logo:'schweppes.png',color:'#E7AD26',aliases:['Schweppes']},
    {key:'MM',label:'Minute Maid',logo:'minute-maid.png',color:'#F2A52B',aliases:['MM','Minute Maid']},
    {key:'Qoo',label:'Qoo',logo:'qoo.png',color:'#63C8EA',aliases:['Qoo']},
    {key:'COSTA',label:'Costa',logo:'costa.png',color:'#7A1E38',aliases:['COSTA','Costa']},
    {key:'Chunyue',label:'Chun Yue',logo:'chun-yue.png',color:'#5A2B82',aliases:['Chunyue','Chun Yue']},
    {key:'ATH',label:'ATH',logo:'ath.png',color:'#19583C',aliases:['ATH']},
    {key:'YG',label:'YG',logo:'yg.png',color:'#F3A01D',aliases:['YG']},
    {key:'Smart',label:'醒目',logo:'smart.png',color:'#4C982E',aliases:['Smart','醒目']},
    {key:'IceDew',label:'IceDew',logo:'icedew.png',color:'#76BEE0',aliases:['IceDew','Icedew']}
  ];
  var CAMPAIGN_COLORS={
    '2026CNY':'#F40009',
    '2605COKEFIFA':'#D92B34',
    '2603CCNSAI':'#252525',
    '2603MMWM':'#F2B233',
    '2503SPRITESPICY':'#159447',
    '2505SPRITESUMMERCAN':'#56B96A',
    '2607SPRITESPICYAI':'#0D7540',
    '檀健次长图文':'#95C93D',
    '2605QOOTY':'#63C8EA',
    '2603CYALI':'#5A2B82',
    '纯悦支付宝活动':'#5A2B82',
    'OCP HonorWall':'#F2C94C'
  };
  var $=function(id){return document.getElementById(id);};
  function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var HONOR_WALL_CODE='OCP HonorWall';
  function canonicalActivityCode(value){
    var raw=String(value||'').trim(),key=raw.replace(/[\s_-]+/g,'').toLowerCase();
    return key==='hw'||key==='honorwall'||key==='202412honorwall'||key==='ocphonorwall'?HONOR_WALL_CODE:raw;
  }
  function normalizeActivityData(input){
    input=input||{recs:[],cuts:[],camps:[],savedAt:''};
    input.cuts=(Array.isArray(input.cuts)?input.cuts:[]).map(function(c){
      var out=Object.assign({},c||{});out.code=canonicalActivityCode(out.code);return out;
    });
    var seen={};
    input.camps=(Array.isArray(input.camps)?input.camps:[]).map(function(c){
      var out=Object.assign({},c||{});out.code=canonicalActivityCode(out.code||out.name);
      if(out.code===HONOR_WALL_CODE)out.name=HONOR_WALL_CODE;
      return out;
    }).filter(function(c){
      var key=String(c.code||c.name||'').toLowerCase();if(!key)return true;
      if(seen[key])return false;seen[key]=1;return true;
    });
    return input;
  }
  function parseDate(v){var m=String(v||'').trim().replace(/[\/.]/g,'-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
  function sourceRec(src){
    return data.recs.filter(function(r){return String(r.utm_source||'').trim()===src;}).sort(function(a,b){
      var da=parseDate(a.date),db=parseDate(b.date);
      return (db?db.getTime():0)-(da?da.getTime():0);
    })[0]||null;
  }
  function prodYear(src){var r=sourceRec(src),y=parseInt(String(r&&r.date||'').slice(0,4),10);return y>=2025?y:0;}
  function brandDef(value){
    var raw=String(value||'').trim();
    return BRAND_DEFS.find(function(b){return b.aliases.some(function(a){return a.toLowerCase()===raw.toLowerCase();});})||{key:raw||'Other',label:raw||'Other',logo:'',color:'#8A817A',aliases:[raw]};
  }
  function brandOrder(value){
    var def=brandDef(value),idx=BRAND_DEFS.findIndex(function(b){return b.key===def.key;});
    return idx<0?999:idx;
  }
  function color(code){
    var key=canonicalActivityCode(code);
    if(CAMPAIGN_COLORS[key])return CAMPAIGN_COLORS[key];
    var fallback=['#C9A227','#4F8E86','#A06A9B','#6689B8','#D47B5B'],h=0;
    for(var i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
    return fallback[h%fallback.length];
  }
  function textColor(code){
    var hex=color(code).replace('#',''),r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    return (r*299+g*587+b*114)/1000<138?'#FFFFFF':'#302B27';
  }
  function codeEvents(){
    var out={};
    data.cuts.forEach(function(c){var s=String(c.utm_source||'').trim();if(!s||!parseDate(c.cut_date))return;(out[s]||(out[s]=[])).push(c);});
    return out;
  }
  function segments(src,bySource){
    var start=new Date(2026,0,1),end=new Date(2026,11,31),days=365;
    var ev=(bySource[src]||[]).slice().sort(function(a,b){return parseDate(a.cut_date)-parseDate(b.cut_date);}),out=[];
    for(var i=0;i<ev.length;i++){
      var s=parseDate(ev[i].cut_date),e=i<ev.length-1?parseDate(ev[i+1].cut_date):new Date(2027,0,1);
      var a=Math.max(0,Math.ceil((s-start)/864e5)),b=Math.min(days,Math.ceil((e-start)/864e5));
      if(b<=0||a>=days||b<=a)continue;
      var today=new Date();today.setHours(0,0,0,0);
      out.push({code:ev[i].code||'—',start:ev[i].cut_date,end:i<ev.length-1?ev[i+1].cut_date:'持续中',left:a/days*100,width:(b-a)/days*100,pending:ev[i].status==='pending'||s>today});
    }
    return out;
  }
  function filtered(){
    var by=codeEvents(),q=$('q').value.trim().toLowerCase(),code=$('code').value;
    var srcs=Object.keys(by).filter(function(src){
      var r=sourceRec(src),y=prodYear(src),sg=segments(src,by);
      if(!r||!y||!sg.length)return false;
      if(selectedBrand&&brandDef(r.brand).key!==selectedBrand)return false;
      if(code&&!sg.some(function(x){return x.code===code;}))return false;
      var hay=[src,r.brand,r.sku_info,r.flavor,r.sku,r.pkg].join(' ').toLowerCase();
      return !q||hay.includes(q);
    });
    srcs.sort(function(a,b){
      var ra=sourceRec(a),rb=sourceRec(b);
      var bo=brandOrder(ra.brand)-brandOrder(rb.brand);if(bo)return bo;
      var da=parseDate(ra.date),db=parseDate(rb.date);
      var ta=da?da.getTime():Number.MAX_SAFE_INTEGER,tb=db?db.getTime():Number.MAX_SAFE_INTEGER;
      return ta-tb||a.localeCompare(b);
    });
    return{srcs:srcs,by:by};
  }
  function exportSources(){
    var by=codeEvents(),q=$('q').value.trim().toLowerCase(),code=$('code').value;
    var srcs=data.recs.filter(function(r){
      var src=String(r.utm_source||'').trim(),y=prodYear(src),events=by[src]||[];
      if(!src||!y||!events.some(function(c){var d=parseDate(c.cut_date);return d&&d.getFullYear()>=2025&&d.getFullYear()<=2026;}))return false;
      if(selectedBrand&&brandDef(r.brand).key!==selectedBrand)return false;
      if(code&&!events.some(function(c){return c.code===code;}))return false;
      var hay=[src,r.brand,r.sku_info,r.flavor,r.sku,r.pkg].join(' ').toLowerCase();
      return !q||hay.includes(q);
    }).map(function(r){return String(r.utm_source||'').trim();});
    srcs=Array.from(new Set(srcs));
    srcs.sort(function(a,b){
      var ra=sourceRec(a),rb=sourceRec(b);
      var bo=brandOrder(ra.brand)-brandOrder(rb.brand);if(bo)return bo;
      var da=parseDate(ra.date),db=parseDate(rb.date);
      var ta=da?da.getTime():Number.MAX_SAFE_INTEGER,tb=db?db.getTime():Number.MAX_SAFE_INTEGER;
      return ta-tb||a.localeCompare(b);
    });
    return{srcs:srcs,by:by};
  }
  function exportLegacyExcel(f){
    function xe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c];});}
    function cell(v,style,merge){return '<Cell ss:StyleID="'+(style||'D')+'"'+(merge?' ss:MergeAcross="'+merge+'"':'')+'><Data ss:Type="String">'+xe(v)+'</Data></Cell>';}
    function fmt(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
    function pale(code){
      var h=color(code).replace('#',''),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16),mix=.55;
      return '#'+[r,g,b].map(function(v){return Math.round(v+(255-v)*mix).toString(16).padStart(2,'0');}).join('').toUpperCase();
    }
    var months=[];for(var y=2025;y<=2026;y++)for(var m=0;m<12;m++)months.push(new Date(y,m,1));
    var today=new Date();today.setHours(0,0,0,0);
    var usedCodes=new Set(),rows=[];
    f.srcs.forEach(function(src){
      var r=sourceRec(src)||{},events=(f.by[src]||[]).map(function(c){
        return{code:String(c.code||'—'),d:parseDate(c.cut_date),status:c.status||'done'};
      }).filter(function(e){return e.d;}).sort(function(a,b){return a.d-b.d;});
      var vals=[r.date||'',r.brand||'',r.sku_info||'',src];
      months.forEach(function(mm){
        var monthEnd=new Date(mm.getFullYear(),mm.getMonth()+1,0,23,59,59),active=null;
        events.forEach(function(e){if(e.d<=monthEnd)active=e;});
        if(active){usedCodes.add(active.code);vals.push({code:active.code,date:fmt(active.d),key:active.code+'|'+active.d.getTime(),pending:active.status==='pending'||active.d>today});}
        else vals.push(null);
      });
      rows.push(vals);
    });
    var codeList=Array.from(usedCodes),styleByCode={};
    var codeStyles=codeList.map(function(code,i){styleByCode[code]='C'+i;return '<Style ss:ID="C'+i+'"><Font ss:FontName="微软雅黑" x:CharSet="134" ss:Bold="1" ss:Size="9"/><Interior ss:Color="'+pale(code)+'" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style>';}).join('');
    var headers=['产码时间','品牌','SKU信息','UTM-SOURCE'].concat(months.map(function(mm){return mm.getFullYear()+'-'+String(mm.getMonth()+1).padStart(2,'0');}));
    var xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>'
      +'<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
      +'<Styles><Style ss:ID="Default"><Font ss:FontName="微软雅黑" x:CharSet="134"/><Alignment ss:Vertical="Center"/></Style><Style ss:ID="D"><Font ss:FontName="微软雅黑" x:CharSet="134"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style><Style ss:ID="H"><Font ss:FontName="微软雅黑" x:CharSet="134" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#111111" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style><Style ss:ID="S"><Font ss:FontName="微软雅黑" x:CharSet="134" ss:Bold="1" ss:Color="#F40009"/><Alignment ss:Vertical="Center"/></Style>'+codeStyles+'</Styles>'
      +'<Worksheet ss:Name="Calendar 2025-2026"><Table ss:ExpandedColumnCount="28" ss:ExpandedRowCount="'+(rows.length+2)+'">'
      +'<Column ss:Width="82"/><Column ss:Width="72"/><Column ss:Width="220"/><Column ss:Width="105"/>'+months.map(function(mm){return'<Column ss:Width="88"'+(mm.getFullYear()===2025?' ss:Hidden="1"':'')+'/>';}).join('')
      +'<Row ss:Height="24">'+headers.map(function(h){return cell(h,'H');}).join('')+'</Row>';
    rows.forEach(function(vals){
      xml+='<Row ss:Height="34">'+cell(vals[0])+cell(vals[1])+cell(vals[2])+cell(vals[3],'S');
      var i=4;
      while(i<vals.length){
        var v=vals[i];if(!v){xml+=cell('');i++;continue;}
        var j=i;while(j+1<vals.length&&vals[j+1]&&vals[j+1].key===v.key)j++;
        xml+=cell(v.code+'\n'+v.date+(v.pending?'\n待执行':''),styleByCode[v.code],j-i);i=j+1;
      }
      xml+='</Row>';
    });
    xml+='<Row><Cell ss:StyleID="D" ss:MergeAcross="27"><Data ss:Type="String">导出范围：当前网页筛选结果；时间线为 2025-01 至 2026-12，2025 年月份列默认隐藏，可在 Excel 中展开查看。</Data></Cell></Row>'
      +'</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><SplitVertical>4</SplitVertical><LeftColumnRightPane>4</LeftColumnRightPane></WorksheetOptions></Worksheet></Workbook>';
    var blob=new Blob(['\ufeff'+xml],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='Label_Code_Campaign_Calendar_'+new Date().toISOString().slice(0,10)+'.xls';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }
  async function exportExcel(){
    var btn=$('export'),f=exportSources();
    if(!f.srcs.length){alert('当前筛选下没有可导出的 Calendar 数据');return;}
    if(typeof ExcelJS==='undefined'){alert('Excel 组件未加载，请确认 vendor 文件夹与 index.html 位于同一目录');return;}
    btn.disabled=true;btn.textContent='正在生成…';
    try{
      var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Calendar 2025-2026',{views:[{state:'frozen',xSplit:4,ySplit:1}]});
      wb.creator='UAD Connected Pack';wb.created=new Date();
      var months=[];for(var y=2025;y<=2026;y++)for(var m=0;m<12;m++)months.push(new Date(y,m,1));
      ws.columns=[
        {header:'产码时间',key:'date',width:13},{header:'品牌',key:'brand',width:12},
        {header:'SKU信息',key:'sku',width:34},{header:'UTM-SOURCE',key:'source',width:17}
      ].concat(months.map(function(mm){return{header:mm.getFullYear()+'-'+String(mm.getMonth()+1).padStart(2,'0'),width:15};}));
      for(var hiddenMonth=0;hiddenMonth<12;hiddenMonth++)ws.getColumn(5+hiddenMonth).hidden=true;
      ws.getRow(1).height=23;ws.getRow(1).eachCell(function(cell){
        cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF111111'}};
        cell.font={bold:true,size:10,color:{argb:'FFFFFFFF'}};
        cell.alignment={horizontal:'center',vertical:'middle'};
      });
      ws.autoFilter={from:'A1',to:'AB1'};
      var today=new Date();today.setHours(0,0,0,0);
      function fmt(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
      function pale(code){
        var h=color(code).replace('#',''),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16),mix=.55;
        return [r,g,b].map(function(v){return Math.round(v+(255-v)*mix).toString(16).padStart(2,'0');}).join('').toUpperCase();
      }
      f.srcs.forEach(function(src){
        var r=sourceRec(src)||{},events=(f.by[src]||[]).map(function(c){
          return{code:String(c.code||'—'),d:parseDate(c.cut_date),status:c.status||'done'};
        }).filter(function(e){return e.d;}).sort(function(a,b){return a.d-b.d;});
        var timeline=[];
        months.forEach(function(mm){
          var monthEnd=new Date(mm.getFullYear(),mm.getMonth()+1,0,23,59,59),active=null;
          events.forEach(function(e){if(e.d<=monthEnd)active=e;});
          timeline.push(active?{code:active.code,date:fmt(active.d),key:active.code+'|'+active.d.getTime(),pending:active.status==='pending'||active.d>today}:null);
        });
        var row=ws.addRow([r.date||'',r.brand||'',r.sku_info||'',src].concat(months.map(function(){return'';})));row.height=34;
        row.getCell(1).alignment={horizontal:'center',vertical:'middle'};
        row.getCell(3).alignment={vertical:'middle',wrapText:true};
        row.getCell(4).font={bold:true,color:{argb:'FFF40009'}};
        var i=0;
        while(i<timeline.length){
          var active=timeline[i];if(!active){i++;continue;}
          var j=i;while(j+1<timeline.length&&timeline[j+1]&&timeline[j+1].key===active.key)j++;
          var c1=5+i,c2=5+j,hex=pale(active.code);
          for(var c=c1;c<=c2;c++){
            var cell=row.getCell(c);cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+hex}};
            cell.font={bold:true,size:9,color:{argb:'FF302B27'},italic:active.pending};
            cell.alignment={horizontal:'left',vertical:'middle',wrapText:true};
          }
          row.getCell(c1).value=active.code+'\n'+active.date+(active.pending?'\n待执行':'');
          if(c2>c1)ws.mergeCells(row.number,c1,row.number,c2);
          i=j+1;
        }
      });
      var note=ws.addRow(['导出范围：当前网页筛选结果；Calendar 时间线固定为 2025-01 至 2026-12。']);
      ws.mergeCells(note.number,1,note.number,28);note.font={italic:true,size:9,color:{argb:'FF6F6A65'}};
      ws.eachRow(function(row){
        row.eachCell({includeEmpty:true},function(cell){
          cell.font=Object.assign({name:'微软雅黑'},cell.font||{});
          cell.alignment=Object.assign({vertical:'middle'},cell.alignment||{});
        });
      });
      var buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='Label_Code_Campaign_Calendar_'+new Date().toISOString().slice(0,10)+'.xlsx';
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    }catch(err){alert('导出失败：'+err.message);}
    finally{btn.disabled=false;btn.textContent='↓ 导出 Excel';}
  }
  function monthHeader(){
    var s='<div class="gantt-head"><div class="label label-head">SKU 信息</div><div class="track month-track">';
    for(var i=0;i<12;i++)s+='<span class="month" style="left:'+(i*100/12)+'%;width:'+(100/12)+'%">'+(i+1)+'月</span>';
    var now=new Date();
    if(now.getFullYear()===2026){var day=Math.ceil((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(2026,0,1))/864e5);s+='<i class="today-line" style="left:'+(day/365*100)+'%"></i>';}
    return s+'</div></div>';
  }
  function render(){
    var f=filtered(),codes=new Set();
    f.srcs.forEach(function(src){segments(src,f.by).forEach(function(x){codes.add(x.code);});});
    var allBy=codeEvents(),allSources=Object.keys(allBy).filter(function(src){return sourceRec(src)&&prodYear(src)&&segments(src,allBy).length;});
    var allCodes=new Set();allSources.forEach(function(src){segments(src,allBy).forEach(function(x){allCodes.add(x.code);});});
    $('m-sku').textContent=allSources.length;$('m-code').textContent=allCodes.size;
    $('legend').innerHTML='<span class="legend-title">Campaign 色标</span>'+Array.from(codes).sort().map(function(c){return '<span class="legend-item"><i class="swatch" style="background:'+color(c)+'"></i>'+esc(c)+'</span>';}).join('');
    $('clear-filter').disabled=!selectedBrand&&!$('q').value.trim()&&!$('code').value;
    Array.prototype.forEach.call($('brand-nav').querySelectorAll('.brand-chip'),function(el){el.classList.toggle('active',el.dataset.brand===selectedBrand);});
    var html='';
    var presentBrands=[];
    f.srcs.forEach(function(src){var r=sourceRec(src),def=brandDef(r&&r.brand);if(!presentBrands.some(function(x){return x.key===def.key;}))presentBrands.push(def);});
    presentBrands.sort(function(a,b){return brandOrder(a.key)-brandOrder(b.key)||a.label.localeCompare(b.label);});
    presentBrands.forEach(function(def,index){
      var list=f.srcs.filter(function(src){var r=sourceRec(src);return r&&brandDef(r.brand).key===def.key;});if(!list.length)return;
      if(typeof collapsedBrands[def.key]==='undefined')collapsedBrands[def.key]=selectedBrand?false:index>0;
      var collapsed=selectedBrand?false:collapsedBrands[def.key];
      var logo=def.logo?'<img src="assets/brands/'+esc(def.logo)+'" alt="">':'<span>'+esc(def.label.slice(0,3))+'</span>';
      html+='<section class="group" style="--group-color:'+def.color+'"><header class="group-head can-collapse" onclick="toggleClientBrand(\''+esc(def.key)+'\')" title="点击'+(collapsed?'展开':'收起')+'"><span class="fold-arrow'+(collapsed?'':' open')+'">▶</span><span class="brand-badge brand-'+esc(def.key)+(def.logo?'':' text')+'">'+logo+'</span><span class="group-title">'+esc(def.label)+'</span><span class="group-count"><strong>'+list.length+'</strong> 个 SKU</span></header><div class="gantt" style="'+(collapsed?'display:none':'')+'">'+monthHeader();
      list.forEach(function(src){
        var r=sourceRec(src),sg=segments(src,f.by);
        html+='<div class="gantt-row"><div class="label" title="'+esc((r.sku_info||''))+'"><span class="src">'+esc(src)+'</span><span class="sku">'+esc((r.sku_info||''))+'</span></div><div class="track">';
        sg.forEach(function(x){html+='<span class="seg'+(x.pending?' pending':'')+'" data-code="'+esc(x.code)+'" data-start="'+esc(x.start)+'" data-end="'+esc(x.end)+'" data-pending="'+(x.pending?'1':'0')+'" style="left:'+x.left.toFixed(3)+'%;width:'+x.width.toFixed(3)+'%;background-color:'+color(x.code)+';color:'+textColor(x.code)+'">'+esc(x.code)+'</span>';});
        var n=new Date();if(n.getFullYear()===2026){var d=Math.ceil((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(2026,0,1))/864e5);html+='<i class="today-line" style="left:'+(d/365*100)+'%"></i>';}
        html+='</div></div>';
      });
      html+='</div></section>';
    });
    $('calendar').innerHTML=html||'<div class="empty"><b>没有匹配的 Calendar 数据</b>请调整搜索或筛选条件</div>';
    Array.prototype.forEach.call(document.querySelectorAll('.seg'),function(el){
      el.onmouseenter=function(e){var t=document.createElement('div');t.className='tooltip';t.id='tip';t.innerHTML='<b>'+esc(el.dataset.code)+'</b><br>'+(el.dataset.pending==='1'?'待切码计划<br>':'')+esc(el.dataset.start)+' → '+esc(el.dataset.end);document.body.appendChild(t);moveTip(e);};
      el.onmousemove=moveTip;el.onmouseleave=function(){var t=$('tip');if(t)t.remove();};
    });
  }
  window.toggleClientBrand=function(brand){collapsedBrands[brand]=!collapsedBrands[brand];render();};
  function moveTip(e){var t=$('tip');if(!t)return;t.style.left=Math.min(e.clientX+12,window.innerWidth-220)+'px';t.style.top=Math.min(e.clientY+12,window.innerHeight-90)+'px';}
  function buildFilters(){
    var codes=Array.from(new Set(data.cuts.map(function(c){return c.code;}).filter(Boolean))).sort();
    $('code').innerHTML='<option value="">全部活动</option>'+codes.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
    var present=new Set(data.recs.map(function(r){return brandDef(r.brand).key;}));
    var defs=BRAND_DEFS.filter(function(b){return present.has(b.key);});
    var by=codeEvents(),totalSources=Object.keys(by).filter(function(src){return sourceRec(src)&&prodYear(src)&&segments(src,by).length;});
    var nav='<button class="brand-chip active" type="button" data-brand="" style="--brand-color:#F40009"><span style="font-size:16px;font-weight:900">ALL</span><span>查看全部</span><span>'+totalSources.length+'</span></button>';
    nav+=defs.map(function(b){
      var visual=b.logo?'<img src="assets/brands/'+esc(b.logo)+'" alt="">':'<span>'+esc(b.label.slice(0,3))+'</span>';
      return '<button class="brand-chip'+(b.logo?'':' text-logo')+'" type="button" data-brand="'+esc(b.key)+'" style="--brand-color:'+b.color+'">'+visual+'<span>'+esc(b.label)+'</span></button>';
    }).join('');
    $('brand-nav').innerHTML=nav;
    Array.prototype.forEach.call($('brand-nav').querySelectorAll('.brand-chip'),function(btn){
      btn.onclick=function(){var next=btn.dataset.brand||'';selectedBrand=selectedBrand===next?'':next;render();if(selectedBrand)$('calendar').scrollIntoView({behavior:'smooth',block:'start'});};
    });
  }
  function resetFilters(){
    selectedBrand='';
    $('q').value='';
    $('code').value='';
    collapsedBrands={};
  }
  async function load(){
    $('status').textContent='正在读取客户发布数据…';
    if(window.__UAD_CALENDAR__&&Array.isArray(window.__UAD_CALENDAR__.recs)&&Array.isArray(window.__UAD_CALENDAR__.cuts)){
      data=normalizeActivityData(Object.assign({recs:[],cuts:[],camps:[],savedAt:''},window.__UAD_CALENDAR__));
      $('status').textContent='已载入客户发布版 · 只读';
      buildFilters();
      var published=new Date(data.savedAt);$('m-date').textContent=isNaN(published.getTime())?'已发布':(published.getFullYear()+'-'+String(published.getMonth()+1).padStart(2,'0')+'-'+String(published.getDate()).padStart(2,'0'));
      render();
      return;
    }
    data=normalizeActivityData({recs:[],cuts:[],camps:[],savedAt:''});
    $('status').textContent='客户数据文件加载失败，请刷新页面或联系 UAD';
    buildFilters();
    $('m-date').textContent='加载失败';
    render();
  }
  ['q','code'].forEach(function(id){$(id).addEventListener(id==='q'?'input':'change',render);});
  $('clear-filter').onclick=function(){resetFilters();render();};
  $('refresh').onclick=function(){resetFilters();load();};
  $('export').onclick=exportExcel;
  load();
})();
</script>
